name: Build

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.*"
          modules: qtcharts
          cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G "Unix Makefiles"

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: |
          macdeployqt build/StudentMannageSystem.app -dmg -verbose=1
          ls -la *.dmg build/*.dmg 2>/dev/null || true
          mv build/StudentMannageSystem.dmg StudentMannageSystem-macOS.dmg 2>/dev/null || mv StudentMannageSystem.dmg StudentMannageSystem-macOS.dmg 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: StudentMannageSystem-macOS
          path: "*.dmg"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.*"
          arch: win64_msvc2019_64
          modules: qtcharts
          cache: true

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          windeployqt build/Release/StudentMannageSystem.exe
          Compress-Archive -Path build/Release/* -DestinationPath StudentMannageSystem-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: StudentMannageSystem-Windows
          path: "*.zip"
